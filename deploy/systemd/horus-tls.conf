# Drop-in that enables TLS on the operator-facing API listener.
#
# horus runs with DynamicUser=yes, so it cannot read files owned by root.
# LoadCredential= hands systemd-owned copies of the cert and key to the
# service; horus finds them as $CREDENTIALS_DIRECTORY/api-tls-cert and
# api-tls-key when HORUS_API_TLS_CERT/KEY are not set. The key stays 0600
# root:root on disk.
#
#   install -d -m 0755 /etc/systemd/system/horus.service.d
#   install -m 0644 deploy/systemd/horus-tls.conf /etc/systemd/system/horus.service.d/tls.conf
#   systemctl daemon-reload && systemctl restart horus
#
# Credentials are copied when the service starts: after renewing the
# certificate, run `systemctl restart horus` (reload is not enough).
[Service]
LoadCredential=api-tls-cert:/etc/horus/tls/tls.crt
LoadCredential=api-tls-key:/etc/horus/tls/tls.key
