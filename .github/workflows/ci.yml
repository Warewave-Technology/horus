name: ci

# Runs on the organization's self-hosted runners. Set the repository variable
# RUNNER_LABELS (a JSON array, e.g. ["self-hosted","linux","x64"]) to pick
# runners; the default is ["self-hosted","linux"]. Jobs run in a golang
# container, so the runner only needs Docker.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Never run pull requests from forks on self-hosted runners: the repository
    # is public and their code would execute on our machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux"]') }}
    container: golang:1.26
    timeout-minutes: 30
    env:
      GOCACHE: /go/cache/build
      GOMODCACHE: /go/pkg/mod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            /go/cache/build
            /go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'operator/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi

      - name: go.mod is tidy
        run: |
          make tidy
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- go.mod go.sum operator/go.mod operator/go.sum

      - name: vet (server + operator)
        run: make vet

      - name: test (server, -race)
        run: make test

      - name: test (operator, -race)
        run: make operator-test

      - name: build
        run: make build operator
